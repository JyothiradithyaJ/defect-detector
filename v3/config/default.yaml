# Unified v3 configuration (Phases 0-6) with D-drive storage paths.
seed: [0, 1, 2]
precision: fp16
early_exit: false

paths:
  data_root: D:/data/mvtec_ad
  visa_root: D:/data/visa
  loco_root: D:/data/mvtec_loco
  apd_root: D:/data/apd
  manifest_dir: data/manifests
  cache_dir: D:/defect_cache/visual_embeddings
  dino_cache_dir: D:/defect_cache/dino_features
  results_dir: D:/defect_cache/results
  logs_dir: D:/defect_cache/logs
  repo_results_dir: v3/docs/results
  decisions_md: v3/docs/decisions.md
  phase1_baseline_json: v3/docs/results/phase_1_logs/v3-category_results.json
  frozen_settings_json: v3/config/frozen_settings.json
  recipes_dir: v3/config/recipes
  hf_home: D:/ml_cache/hf
  torch_home: D:/ml_cache/torch
  temp_dir: D:/ml_cache/tmp

clip:
  backbones:
    clip_b32_224:
      model: ViT-B-32-quickgelu
      pretrained: openai
      input: 224
      precision: fp32
    clip_l14_336:
      model: ViT-L-14-336
      pretrained: openai
      input: 336
      precision: fp16
  model: ViT-L-14-336
  pretrained: openai
  input: 336
  a: 0.95
  b: 0.05
  batch_size: 8
  fallback_batch_size: 4

dino:
  model: dinov2_vitl14_reg
  timm_name: vit_large_patch14_reg4_dinov2.lvd142m
  short_side: 560
  patch_size: 14
  embed_dim: 1024
  topk_frac: 0.001
  chunk_size: 4096
  pca_variance: 0.95
  pca_max_components: 128

match:
  mode: knn_positional
  scorers: [knn_global, knn_positional, pca_residual]
  radius: 2
  agg_radii: [1, 3]

refs:
  k: 4
  fewshot_k_grid: [1, 2, 4, 8, 16]
  source: train_split
  augment: photometric_only

stage_a:
  orb_nfeatures: 1500
  ransac_reproj_thresh: 5.0
  ecc_max_iter: 100
  ecc_eps: 1.0e-4
  max_align_residual: 0.35
  variant_min_cosine: 0.80
  default_z_threshold: 3.5

fusion:
  w_d: 1.0
  w_c: 0.0
  weight_grid:
    - [1.0, 0.0]
    - [0.85, 0.15]
    - [0.70, 0.30]
    - [0.50, 0.50]
    - [0.0, 1.0]

decide:
  false_reject_rate: 0.05
  min_mad: 1.0e-3
  surface_roi_defect_quantile: 0.95

qc:
  blur_floor_percentile: 5
  exposure_mad_multiplier: 4.0
  contrast_mad_multiplier: 4.0
  min_framing_coverage: 0.85
