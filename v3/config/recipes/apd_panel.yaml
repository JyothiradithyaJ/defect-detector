name: apd_panel
resolution: [1920, 1080]
view: fixed
symmetry: none
rois:
  - {id: ev_port_left_cables, kind: order, severity: 1, hard: false, params: {axis: y, expected: [brown, green, blue]}}
  - {id: sensor_right_wires, kind: count, severity: 1, hard: false, params: {expected: 2}}
  - {id: red_cap_left, kind: presence, severity: 2, hard: false, params: {hsv: red, area_ratio: [0.01, 0.05]}}
  - {id: pcb_left, kind: surface, severity: 0, hard: true, params: {}}

